<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancer Strategy Monitor</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#ffffff; --soft:#f6f7f9; --line:#eceef2; --line2:#e1e4ea;
  --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --accent:#2563eb; --accent-soft:#eef3ff;
  --green:#15803d; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --yellow:#a16207; --yellow-bg:#fefce8; --yellow-line:#fde68a;
  --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --grey-bg:#f1f5f9;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --top:60px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}

/* top bar */
.top{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand:hover{text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:9px;border:2.5px solid #fff;border-radius:50%}
.brand-name{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{display:block;font-size:11.5px;color:var(--muted)}
.ask{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--ink)}
.ask:hover{border-color:var(--accent);color:var(--accent)}

/* home: areas | map | status */
.home{display:grid;grid-template-columns:230px minmax(0,1fr) 460px;height:calc(100vh - var(--top))}
.areas{border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px}
.areas-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:0 10px 8px}
.area{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--ink);user-select:none}
.area:hover{background:var(--soft)}
.area.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.area.fi{font-weight:600;margin-bottom:6px;border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;padding-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.green,.dot.ok{background:#22c55e}.dot.yellow{background:#eab308}.dot.red,.dot.bad{background:#ef4444}.dot.na,.dot.nat{background:#cbd5e1}
.mapcol{display:flex;flex-direction:column;align-items:center;padding:18px 20px 14px;min-height:0}
.map-title{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.map-title h1{font-size:20px;margin:0;letter-spacing:-.02em}
.map-title .sub{font-size:12.5px}
.mapbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.mapbox svg{height:100%;max-height:calc(100vh - var(--top) - 120px);width:auto;max-width:100%}
.mapbox path{stroke:#ffffff;stroke-width:.8;cursor:pointer;transition:fill .12s}
.mapbox path.green{fill:#bbf7d0}.mapbox path.yellow{fill:#fde68a}.mapbox path.red{fill:#fca5a5}
.mapbox path.na{fill:#eef1f4;cursor:default}
.mapbox path:hover{stroke:#0f172a;stroke-width:1}
.mapbox path.sel{stroke:#0f172a;stroke-width:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);padding-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.status{border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 24px;background:#fff}
.st-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.st-sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.gcard{display:block;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:10px;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;border-left-width:4px}
.gcard:hover{text-decoration:none;transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 10px 24px rgba(15,23,42,.08)}
.gcard.green{border-left-color:#22c55e}.gcard.yellow{border-left-color:#eab308}.gcard.red{border-left-color:#ef4444}
.gtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.gnum{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.gtitle{flex:1;font-weight:650;line-height:1.35}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.tlist li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:baseline;font-size:12.8px}
.tlist .ts{color:var(--muted);text-align:right;white-space:nowrap}
.tlist .ts.bad{color:var(--red);font-weight:600}
.chev{color:var(--faint);font-size:12px;text-align:right;margin-top:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.green,.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.yellow{background:var(--yellow-bg);color:var(--yellow)}
.pill.red,.pill.bad{background:var(--red-bg);color:var(--red)}
.pill.na,.pill.nat{background:var(--grey-bg);color:var(--muted)}
.badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:#fff7ed;color:#c2410c;text-transform:uppercase}

/* detail pages */
.page{max-width:1080px;margin:0 auto;padding:20px 28px 60px}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:6px 12px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.trail{color:var(--muted);font-size:13px;margin-left:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{padding:22px;margin-bottom:18px}
.kicker{font-size:12px;color:var(--muted);margin-bottom:6px}
.hero h1{font-size:22px;margin:0;letter-spacing:-.02em;line-height:1.3}
.hero-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.rule{font-size:12px;color:var(--faint);margin-top:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 14px;min-width:140px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .n.bad{color:var(--red)} .kpi .n.ok{color:var(--green)}
h2{font-size:16px;margin:26px 0 10px;letter-spacing:-.01em}
.tcard{padding:16px;margin-bottom:10px}
.tcard-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tcard-text{font-weight:600;line-height:1.4}
.foot{font-size:12px;color:var(--muted);margin-top:4px}
.mrows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:14px 1.4fr .8fr .9fr 1fr 16px;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--soft);color:var(--ink);font-size:13px}
a.mrow:hover{background:#eef1f5;text-decoration:none}
.mrow .lbl{font-weight:500}
.mrow .v{font-variant-numeric:tabular-nums;font-weight:650}
.mrow .v.bad{color:var(--red)}
.mrow .m{color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .go{color:var(--faint)}
.nodata{margin-top:8px;font-size:13px;color:var(--muted)}
.sup-title{font-size:12px;color:var(--muted);margin-top:10px}
.contact{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:12px 14px;align-items:center}
.contact .who{display:flex;flex-direction:column}
.contact .n{font-weight:600;display:flex;gap:6px;align-items:center}
.contact .c{color:var(--muted);font-size:12.5px}
.peers{display:flex;flex-direction:column;gap:8px}
.peer{display:grid;grid-template-columns:180px 200px 1fr;gap:12px;align-items:center;padding:10px 14px}
.peer .pr{font-weight:600}
.peer .pv{font-variant-numeric:tabular-nums;font-weight:600;color:var(--green)}
.peer .pv.bad{color:var(--red)}
.peer .pc{display:flex;flex-direction:column;font-size:12.5px}
.peer .pc .n{font-weight:500;display:flex;gap:6px;align-items:center}
.peer .pc .c{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-bottom:8px}
.more{border:0;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px}
.report{padding:18px}
.ai-note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rsec{margin-top:14px}
.rsec h4{margin:0 0 8px}
.flag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
.ritem{padding:10px 12px;border-radius:10px;background:var(--soft);margin-bottom:8px}
.ritem p{margin:0 0 6px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin-right:12px}
.tier{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;background:#e0e7ff;color:#3730a3}
.tier.A{background:#dcfce7;color:#166534}.tier.C{background:#fef3c7;color:#92400e}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.spinner{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.chartcard{padding:14px 16px}
.chartcard svg{width:100%;height:auto;display:block}

/* chat */
.chat-box{display:flex;flex-direction:column;min-height:0}
.chat-card{height:380px}
.chat-card .chat-box{height:100%}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.ai h5{margin:8px 0 4px;font-size:12.5px}
.msg.ai ul{margin:4px 0;padding-left:18px}
.msg.ai p{margin:4px 0}
.msg .srcs{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);font-size:12px;display:flex;flex-direction:column;gap:3px}
.empty{color:var(--faint);font-size:13px;text-align:center;margin:auto 16px}
.chat-in{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;resize:none;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font:inherit;color:var(--ink);outline:none}
.chat-in textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chat-in button{width:42px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px}

/* drawer */
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:420px;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(15,23,42,.08);transform:translateX(105%);transition:transform .2s;z-index:30;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.drawer-title{font-weight:700;font-size:15px}
.drawer-sub{font-size:12px;color:var(--muted)}
.drawer .chat-box{flex:1}
.icon-btn{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px}
.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:50;white-space:nowrap}
svg text{font-family:inherit}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mapbox svg{overflow:visible}
.mapbox .outline{display:none;pointer-events:none}
.mapbox svg.fi .outline{display:inline}
.mapbox .outline path{fill:none;stroke:#0f172a;stroke-width:5;stroke-linejoin:round;cursor:default}
.gcard.na{border-left-color:#cbd5e1}
.num.ok,.mrow .v.ok{color:var(--green);font-weight:600}
.num.bad{color:var(--red);font-weight:600}
.tlist .ts{color:var(--muted)}
.peer .pk{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.num{color:var(--ink)}
.tlist .ts.ok{color:var(--green);font-weight:600}
.tlist .ts.bad{color:var(--red);font-weight:600}
.gcard{border-left-width:1px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

</style>
</head>

<header class="top">
  <a class="brand" href="#/">
    <span class="logo" aria-hidden="true"></span>
    <span><span class="brand-name">Cancer Strategy Monitor</span><span class="brand-sub">Finland's National Cancer Strategy 2026–2035</span></span>

</header>
<div id="view"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">

    <button class="icon-btn" id="drawerClose" aria-label="Close">✕</button>
  </div>
  <div class="chat-box" id="generalChat"></div>
</aside>

652L12 653.3L11.1 654.7L10.9 655.5L11.8 656.2L12.9 656.3L13.4 656.7L14.7 657.5L14.3 659.7L14.1 660.6L13.4 661.4L12.1 661.4L12.2 659.3L12.2 657.6L10.6 657.3L9.2 658.7L7.3 659L5.5 658.7L4.1 659.4L2.4 660.2L0.9 660.8L0.2 661.4L0 662.4L0.6 662.7L1.6 663.3L1.5 664L0.9 665.4L0.9 666.7L1.2 667.9L1.9 668.9L3.2 668.8L3.8 667.2L4.4 666.8L5.1 667.4L6 667.4L6.9 667.4L7.5 667.9L8.6 669.5L8.6 670.5L9 672.3L10.6 673.4L12.1 673.6L12.8 674L13.7 677.3L14.5 677.4L16.3 676.9L17.7 677.3L19.3 678.7L20.2 680.1L20.7 681.3L22 681.2L22.4 682.8ZM46.7 690.5L47.6 690.5L48.2 689.9L48.7 689.3L49.7 689.1L50.5 688.1L50.6 687.1L50 686.6L48.7 686.2L47.5 686.2L46.2 686.6L45.2 687.6L44.8 688.6L45.1 689.2L46.7 690.5Z"}]}};window.__REPORTS__={"S3.2": {"title": "How cancer mortality has been reduced elsewhere", "generated": "2026-11-14", "sections": [{"name": "Finland", "items": [{"text": "In the NORDCAN comparison, survival improved least in Finland between 2001–2005 and 2011–2015 (5-year survival +3–4 percentage points, compared with +8–12 in Denmark).", "sources": [{"title": "Engholm, ENCR 2018 (NORDCAN presentation)", "url": "https://encr.eu/sites/default/files/2018-ENCR-Conference/EngholmENCR_SurvivalNORDCAN.pdf", "tier": "B"}]}, {"text": "Lung cancer causes the most cancer deaths in Finland, and outcomes are worse than in the other Nordic countries. Reasons include slower access to a doctor and narrower diagnostics in primary care.", "sources": [{"title": "University of Helsinki: study in Acta Oncologica 2025", "url": "https://www.helsinki.fi/fi/uutiset/terveys/miksi-suomessa-keuhkosyopaan-kuollaan-aiemmin-kuin-pohjoismaissa", "tier": "B"}]}]}, {"name": "Other Nordic countries", "items": [{"text": "Denmark closed its survival gap with the other Nordic countries through four national cancer plans (2000–2015), patient pathways, public monitoring of waiting times and expanded screening.", "sources": [{"title": "Engholm, ENCR 2018 (NORDCAN presentation)", "url": "https://encr.eu/sites/default/files/2018-ENCR-Conference/EngholmENCR_SurvivalNORDCAN.pdf", "tier": "B"}]}, {"text": "A NORDCAN study attributes the improvements to several factors: earlier diagnosis, better treatment, national cancer plans, uniform guidelines and standardised pathways.", "sources": [{"title": "Lundberg et al. 2020, Acta Oncologica", "url": "https://doi.org/10.1080/0284186X.2020.1822544", "tier": "B"}]}]}, {"name": "Rest of the world", "items": [{"text": "In the Dutch-Belgian NELSON trial, low-dose CT screening reduced lung cancer mortality among high-risk men by 24% over ten years.", "sources": [{"title": "de Koning et al. 2020, New England Journal of Medicine", "url": "https://doi.org/10.1056/NEJMoa1911793", "tier": "A"}]}]}]}, "S2.2": {"title": "How screening participation has been increased elsewhere", "generated": "2026-11-14", "sections": [{"name": "Finland", "items": [{"text": "In a randomised trial in Espoo, mailing an HPV self-sampling kit to women who had missed screening brought in more participants than a reminder letter (29.8% vs 26.2%).", "sources": [{"title": "Virtanen et al. 2011, International Journal of Cancer", "url": "https://doi.org/10.1002/ijc.25581", "tier": "B"}]}, {"text": "Offering self-sampling as the first reminder raised total attendance by 17%. A cost analysis suggests a letter as the first reminder and self-sampling as the second.", "sources": [{"title": "Virtanen, Anttila & Nieminen 2015, BMC Women's Health", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4635548", "tier": "B"}]}, {"text": "An opt-in model, where non-attenders order a self-sampling kit on request, was also found feasible in Finland.", "sources": [{"title": "Finnish opt-in self-sampling pilot (PMC)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9796070", "tier": "B"}]}]}, {"name": "Other Nordic countries", "items": [{"text": "Stockholm sent self-sampling kits directly to about 330,000 women instead of an invitation. Organised screening test coverage rose from 54% to 60% within a year.", "sources": [{"title": "Elfström, Gray & Dillner 2023, eLife", "url": "https://elifesciences.org/articles/80905", "tier": "B"}]}]}, {"name": "Rest of the world", "items": [{"text": "A systematic review found that postal and telephone reminders, a GP signature on the invitation, and a pre-booked appointment (instead of an open invitation) increase participation.", "sources": [{"title": "BMC Public Health 2013 (systematic review)", "url": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3686655/", "tier": "A"}]}, {"text": "In colorectal screening, advance notification letters, mailing the faecal test home, written reminders and a phone call from an adviser increase test return.", "sources": [{"title": "Rat et al. 2018, European Journal of Cancer Prevention (systematic review)", "url": "https://doi.org/10.1097/CEJ.0000000000000344", "tier": "A"}]}, {"text": "Pre-screening reminders, GP endorsement, more personal reminders and more acceptable tests (e.g. self-sampling) also work in under-served groups.", "sources": [{"title": "Journal of Medical Screening 2017 (rapid review)", "url": "https://pubmed.ncbi.nlm.nih.gov/27754937/", "tier": "A"}]}]}]}, "S3.3": {"title": "How access to cancer treatment has been sped up elsewhere", "generated": "2026-11-14", "sections": [{"name": "Finland", "items": [{"text": "A peer-reviewed Nordic comparison found that patients with lung symptoms wait longer in Finland at every stage of the pathway. Elsewhere, CT is used more widely early in the pathway, which allows earlier diagnosis.", "sources": [{"title": "University of Helsinki: study in Acta Oncologica 2025", "url": "https://www.helsinki.fi/fi/uutiset/terveys/miksi-suomessa-keuhkosyopaan-kuollaan-aiemmin-kuin-pohjoismaissa", "tier": "B"}]}, {"text": "The national quality registry pilot report on lung cancer found large regional differences in diagnostics. Stage information was missing for almost half of the patients, which makes comparisons difficult.", "sources": [{"title": "Verkkouutiset: Cancer Society quality registry report", "url": "https://www.verkkouutiset.fi/a/keuhkosyopa-todetaan-usein-liian-myohaan-vain-joka-neljas-saa-parantavaa-hoitoa/", "tier": "C"}]}]}, {"name": "Other Nordic countries", "items": [{"text": "Denmark introduced national cancer patient pathways in 2008, with maximum time limits for diagnostics and the start of treatment. Waiting times fell significantly.", "sources": [{"title": "Probst et al. 2012, Health Policy", "url": "https://doi.org/10.1016/j.healthpol.2011.11.001", "tier": "B"}]}, {"text": "Sweden adopted the model in 2015 (standardised care pathways, SVF). The time from well-founded suspicion to treatment is measured the same way across the country.", "sources": [{"title": "Regional Cancer Centres: Cancer Patient Pathways", "url": "https://cancercentrum.se/syd/regional-cancer-centres/knowledge-based-healthcare/cancer-patient-pathways/", "tier": "B"}]}, {"text": "Swedish state funding to regions is tied to targets: 70% of patients assessed through a pathway, and 80% of those assessments completed within the target time.", "sources": [{"title": "Government of Sweden, press release 12/2024", "url": "https://www.regeringen.se/pressmeddelanden/2024/12/positiva-resultat-inom-cancervarden/", "tier": "B"}]}]}, {"name": "Rest of the world", "items": [{"text": "England introduced a 28-day standard in 2021: cancer is diagnosed or ruled out within 28 days of referral, supported by rapid diagnostic centres.", "sources": [{"title": "NHS England: Faster Diagnosis Framework", "url": "https://www.england.nhs.uk/wp-content/uploads/2019/07/B1332-NHS-Cancer-Programme-Faster-Diagnosis-Framework-v5.pdf", "tier": "B"}]}, {"text": "Rapid diagnostic centres are based on the Danish model and serve patients with vague symptoms. In an evaluation, 7% were diagnosed with cancer and a third with another significant condition.", "sources": [{"title": "British Journal of Cancer 2020", "url": "https://link.springer.com/10.1038/s41416-020-01207-7", "tier": "B"}]}]}]}, "S2.1": {"title": "How HPV vaccination coverage has been raised elsewhere (supporting indicator for preventable cancers)", "generated": "2026-11-14", "sections": [{"name": "Finland", "items": [{"text": "According to THL, most children receive the HPV vaccine as recommended in primary school. Few new vaccination series start after basic education, so reaching children at school age is decisive.", "sources": [{"title": "THL press release 29 Nov 2023", "url": "https://www.sttinfo.fi/tiedote/70064492/storsta-delen-av-barnen-far-hpv-vaccin-enligt-rekommendationen-flickornas-vaccinationstackning-ar-hogre-an-pojkarnas?publisherId=69817778", "tier": "B"}]}, {"text": "In THL figures, Finnish coverage is lower than in the other Nordic countries: 80% of girls born in 2012 received a first dose, while Sweden, Norway and Iceland exceeded 90%.", "sources": [{"title": "MTV Uutiset (THL data)", "url": "https://www.mtvuutiset.fi/artikkeli/halyttava-tieto-suomalaisnuorten-hpv-rokotuskattavuudesta/9227618", "tier": "C"}]}]}, {"name": "Other Nordic countries", "items": [{"text": "In Norway, the vaccine is given at school during school hours by a public health nurse and free of charge, so cost and access barriers are minimal.", "sources": [{"title": "BMJ Open 2015: HPV vaccination in the Norwegian school programme", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4442157", "tier": "B"}]}, {"text": "A Norwegian registry study found that school-based delivery is largely equitable. Information campaigns aimed at lower-uptake groups could narrow the remaining gaps.", "sources": [{"title": "Preventive Medicine 2015: registry study of 90,000 Norwegian girls", "url": "https://doi.org/10.1016/j.ypmed.2015.04.024", "tier": "B"}]}]}, {"name": "Rest of the world", "items": [{"text": "A meta-analysis found that digital reminders (text messages, alerts to professionals in patient records) increase vaccine uptake, while information alone does not.", "sources": [{"title": "Chandeying & Thongseiratch 2023, npj Digital Medicine", "url": "https://www.nature.com/articles/s41746-023-00912-w", "tier": "A"}]}, {"text": "High-coverage countries usually vaccinate at school and send systematic invitations and reminders. Low-coverage countries more often vaccinate in clinics without reminders.", "sources": [{"title": "Systematic review 2024, Human Vaccines & Immunotherapeutics", "url": "https://doi.org/10.1080/21645515.2024.2319426", "tier": "A"}]}]}]}};</script>
<script>
/* Cancer Strategy Monitor – UI (vanilla JS, no external libraries) */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null ? '–' : Number(v).toLocaleString('en-GB', { maximumFractionDigits: d });
const enc = encodeURIComponent;
const FI = 'FI';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

let D, M, AI = { ai: false };
let sel = FI;
const chats = {};
const showAll = {};

const SHORT = {
  'S1.1': 'PROM & NPS measured systematically', 'S1.2': 'NPS above 80',
  'S2.1': 'Preventable cancers −1,000 / year', 'S2.2': 'Screening participation ≥ 80%', 'S2.3': '≥ 70% diagnosed at stage I–II',
  'S3.1': 'Poor-prognosis survival to Nordic level', 'S3.2': 'Cancer mortality −10%', 'S3.3': 'Treatment within target times',
  'S4.1': 'New cancer studies +10% / year', 'S4.2': '> 10% of patients in interventional trials', 'S4.3': 'Single-channel assessment of cancer medicines'
};
const TIER = { A: 'Review or official guideline', B: 'Study or public authority', C: 'News or practical example' };

/* ---------- helpers ---------- */
const per = p => p && p.length === 7 ? `${MON[+p.slice(5) - 1]} ${p.slice(0, 4)}` : p;
const rname = r => r === FI ? 'Whole country' : r;
const val = (m, r) => r === FI ? M[m].national : M[m].values[r];
const isOk = (m, v) => v == null ? null : (M[m].kind === 'min' ? v >= M[m].target : v <= 0);
const mOk = (m, r) => isOk(m, val(m, r));
const fmt = (m, v) => v == null ? '–' : M[m].unit === '%' ? `${nf(v)}%` : nf(v, 0);
const fmtT = m => M[m].kind === 'min' ? `≥ ${nf(M[m].target, 0)}%` : (M[m].unit === '%' ? '0%' : '0');
const allTargets = () => D.goals.flatMap(g => g.targets.map(t => ({ ...t, goal: g })));
const T = id => allTargets().find(t => t.id === id);
const parentOf = m => m === 'mort' ? T('S3.2') : allTargets().find(t => (t.measures || []).includes(m) || (t.support || []).includes(m));
const byName = (a, b) => a.localeCompare(b, 'fi');

function mort() {
  const mo = D.mort, last = Math.max(...Object.keys(mo.counts).map(Number));
  return { mo, last, v: mo.counts[last], ok: mo.counts[last] <= mo.target };
}
const cls = ok => ok === false ? 'bad' : ok ? 'ok' : '';
const num = (txt, ok) => `<span class="num ${cls(ok)}">${txt}</span>`;
function tStatus(t, r) {
  if (t.type === 'measures') {
    if (M[t.measures[0]].kind === 'min') { const a = agg(t, r); return a.ok == null ? 'na' : a.ok ? 'ok' : 'bad'; }
    const s = t.measures.map(m => mOk(m, r));
    if (s.includes(false)) return 'bad';
    return s.every(x => x == null) ? 'na' : 'ok';
  }
  if (t.type === 'national') return mort().ok ? 'ok' : 'bad';
  return 'na';
}
/* main goal: not met if any target is below target; no data if no target has data */
function gStatus(g, r) {
  const st = g.targets.map(t => tStatus(t, r)), n = st.filter(x => x === 'bad').length;
  return { n, c: n ? 'red' : st.every(x => x === 'na') ? 'na' : 'green' };
}
/* area colour by targets not met: 0–3 = green, 4–5 = yellow, 6 or more = red */
function overall(r) { const n = allTargets().filter(t => tStatus(t, r) === 'bad').length; return { n, c: n <= 3 ? 'green' : n <= 5 ? 'yellow' : 'red' }; }
const gLabel = s => s.n ? 'Not met' : s.c === 'na' ? 'No data' : 'Met';
const oLabel = o => `${o.n} of ${allTargets().length} targets not met`;
/* summary value for a target with several measures */
const AVG_LABEL = { 'S2.1': 'Average HPV vaccination coverage', 'S2.2': 'Average screening participation' };
function agg(t, r) {
  if (M[t.measures[0]].kind === 'zero') {
    const vs = t.measures.filter(m => M[m].unit === 'patients').map(m => val(m, r)).filter(v => v != null);
    const v = vs.length ? vs.reduce((a, b) => a + b, 0) : null;
    return { label: 'Patients waiting over 90 days', v, text: v == null ? '–' : nf(v, 0), target: '0', ok: v == null ? null : v <= 0 };
  }
  const tg = M[t.measures[0]].target, vs = t.measures.map(m => val(m, r)).filter(v => v != null);
  const v = vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
  return { label: AVG_LABEL[t.id] || 'Average', v, text: v == null ? '–' : `${nf(v)}%`, target: `≥ ${tg}%`, ok: v == null ? null : v >= tg };
}
const tLabel = s => ({ ok: 'Met', bad: 'Not met', na: 'No data', nat: 'National target' }[s]);
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;

/* ---------- start ---------- */
function loadData() {
  if (location.protocol === 'file:') {
    return window.__DATA__ ? Promise.resolve(window.__DATA__) : fetch('data.json').then(r => r.json());
  }
  return fetch('/api/data')
    .then(r => {
      if (!r.ok) throw new Error('Data API responded ' + r.status);
      return r.json();
    })
    .catch(err => {
      console.warn('Falling back to local data:', err.message);
      return window.__DATA__ ? Promise.resolve(window.__DATA__) : fetch('data.json').then(r => r.json());
    });
}

function loadStatus() {
  if (location.protocol === 'file:') return Promise.resolve({ ai: false, offline: true });
  return fetch('/api/data/status')
    .then(r => r.ok ? r.json() : fetch('/api/status').then(res => res.json()))
    .catch(() => ({ ai: false, offline: true }));
}

Promise.all([loadData(), loadStatus()]).then(([d, s]) => {
  D = d; M = d.measures; AI = s;
  if (D.snapshot?.revision) {
    const sub = document.querySelector('.brand-sub');
    if (sub && !sub.querySelector('.data-rev-badge')) {
      const revBadge = document.createElement('span');
      revBadge.className = 'pill ok data-rev-badge';
      revBadge.style.cssText = 'margin-left: 8px; font-size: 10px; font-weight: normal; vertical-align: middle; padding: 2px 6px;';
      revBadge.title = 'Dataset revision: ' + D.snapshot.revision;
      revBadge.textContent = 'Data: ' + D.snapshot.revision.slice(0, 8);
      sub.appendChild(revBadge);
    }
  }
  $('#askBtn').onclick = () => toggleDrawer(true);
  $('#drawerClose').onclick = () => toggleDrawer(false);
  window.addEventListener('hashchange', route); route();
});
document.addEventListener('scroll', () => { $('#tooltip').style.opacity = 0; }, true);

function route() {
  $('#tooltip').style.opacity = 0;
  const h = location.hash.replace(/^#\/?/, '');
  const [path, q] = h.split('?');
  const r = new URLSearchParams(q || '').get('r');
  if (r && (r === FI || D.regions.includes(r))) sel = r;
  const [kind, id] = path.split('/');
  const v = $('#view');
  if (kind === 'goal' && D.goals.find(g => g.id === id)) renderGoal(v, id);
  else if (kind === 't' && T(id) && T(id).type === 'measures') renderTarget(v, id);
  else if (kind === 'm' && (M[id] || id === 'mort')) renderMeasure(v, id);
  else renderHome(v);
  window.scrollTo(0, 0);
}

/* ---------- home: areas | map | status ---------- */
function renderHome(v) {
  const regs = D.regions.slice().sort(byName);
  v.innerHTML = `<div class="home">
    <aside class="areas"><div class="areas-title">Areas</div>
      ${[FI, ...regs].map(r => `<div class="area ${r === FI ? 'fi' : ''} ${r === sel ? 'on' : ''}" data-r="${esc(r)}">${esc(rname(r))}</div>`).join('')}
    </aside>
    <section class="mapcol">
      <div class="map-title"><h1>Strategy targets by area</h1><span class="sub" style="color:var(--muted)">Hover an area in the list or click the map</span></div>
      <div class="mapbox">${mapSvg()}</div>
      <div class="legend"><span><i class="dot green"></i>0–3 targets not met</span><span><i class="dot yellow"></i>4–5 targets not met</span><span><i class="dot red"></i>6 or more targets not met</span></div>
    </section>
    <aside class="status" id="status"></aside>
  </div>`;
  v.querySelectorAll('.area').forEach(el => {
    el.addEventListener('mouseenter', () => select(el.dataset.r));
    el.addEventListener('click', () => select(el.dataset.r));
  });
  const tip = $('#tooltip');
  v.querySelectorAll('.mapbox path[data-r]').forEach(p => {
    p.addEventListener('mousemove', e => {
      const o = overall(p.dataset.r);
      tip.innerHTML = `<b>${esc(p.dataset.r)}</b> · ${oLabel(o)}`;
      tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; tip.style.opacity = 1;
    });
    p.addEventListener('mouseleave', () => tip.style.opacity = 0);
    p.addEventListener('click', () => select(p.dataset.r));
  });
  renderStatus();
}
function mapSvg() {
  const { W, H, features } = D.map;
  return `<svg viewBox="0 0 ${W} ${H}" class="${sel === FI ? 'fi' : ''}" role="img" aria-label="Map of Finland's wellbeing services counties">
    <g class="outline">${features.filter(f => f.alue !== 'Ahvenanmaa').map(f => `<path d="${f.d}"></path>`).join('')}</g>${features.map(f =>
    f.alue === 'Ahvenanmaa' ? `<path class="na" d="${f.d}"></path>`
      : `<path d="${f.d}" data-r="${esc(f.alue)}" class="${overall(f.alue).c} ${f.alue === sel ? 'sel' : ''}"></path>`).join('')}</svg>`;
}
function select(r) {
  if (r === sel) return;
  sel = r;
  document.querySelectorAll('.area').forEach(a => a.classList.toggle('on', a.dataset.r === sel));
  const svg = document.querySelector('.mapbox svg'); if (svg) svg.classList.toggle('fi', sel === FI);
  document.querySelectorAll('.mapbox path[data-r]').forEach(p => {
    const on = p.dataset.r === sel; p.classList.toggle('sel', on);
    if (on) p.parentNode.appendChild(p);
  });
  renderStatus();
}
function targetLine(t, r) {
  const s = tStatus(t, r);
  return `<li><span class="dot ${s}"></span><span>${esc(SHORT[t.id])}</span><span class="ts ${s}">${esc(tLabel(s))}</span></li>`;
}
function renderStatus() {
  const el = $('#status'); if (!el) return;
  const o = overall(sel);
  el.innerHTML = `<div class="st-head"><div class="st-title">${esc(rname(sel))}</div>${pill(o.c, oLabel(o))}</div>
    <div class="st-sub">HPV ${M.hpv_tytot.period} · Screening ${M.suolisto.period} · Waiting times ${per(M.onk90.period)} · Mortality ${mort().last}</div>
    ${D.goals.map(g => {
      return `<a class="gcard" href="#/goal/${g.id}?r=${enc(sel)}">
        <div class="gtop"><span class="gnum">${g.id}</span><span class="gtitle">${esc(g.title)}</span></div>
        <ul class="tlist">${g.targets.map(t => targetLine(t, sel)).join('')}</ul>
        <div class="chev">Open goal ›</div></a>`;
    }).join('')}`;
}

/* ---------- shared blocks ---------- */
function crumbs(trail) {
  return `<div class="crumbs"><button class="btn" onclick="history.length > 1 ? history.back() : (location.hash = '#/')">← Back</button>
    <a class="btn" href="#/">⌂ Home</a><span class="trail">${trail}</span></div>`;
}
function contactCard(r, role) {
  const c = D.contacts[r][role];
  return `<div class="card contact"><div><div style="font-weight:600">${esc(rname(r))}</div><div class="c" style="color:var(--muted);font-size:12.5px">${esc(c.role)}</div></div>
    <div class="who"><span class="n">${esc(c.name)}</span>
    <span class="c"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a> · ${esc(c.phone)}</span></div></div>`;
}
function peersBlock(key, list, valueOf, role, intro, label) {
  const all = showAll[key], shown = all ? list : list.slice(0, 5);
  return `<div class="hint">${intro}</div><div class="peers">${shown.map(p => {
    const c = D.contacts[p.r][role];
    return `<div class="card peer"><div class="pr">${esc(p.r)}</div><div class="pv ${p.good ? 'ok' : 'bad'}"><span class="pk">${esc(label)}</span>${esc(valueOf(p.r))}</div>
      <div class="pc"><span class="n">${esc(c.name)}</span><span class="c">${esc(c.role)}</span>
      <span class="c"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a> · ${esc(c.phone)}</span></div></div>`;
  }).join('')}</div>
  ${list.length > 5 ? `<button class="more" data-more="${esc(key)}">${all ? 'Show fewer' : `Show all ${list.length}`}</button>` : ''}`;
}
function bindMore(root, rerender) {
  root.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { showAll[b.dataset.more] = !showAll[b.dataset.more]; rerender(); });
}
const sizeDiff = (a) => Math.abs((D.size[a] || 0) - (sel === FI ? 0 : (D.size[sel] || 0)));
function peersForMeasure(m) {
  const regs = D.regions.filter(r => r !== sel);
  let list = regs.filter(r => mOk(m, r) === true);
  if (M[m].kind === 'min') list.sort((a, b) => val(m, b) - val(m, a));
  else list.sort((a, b) => (sel === FI ? byName(a, b) : sizeDiff(a) - sizeDiff(b)) || byName(a, b));
  if (list.length) return { list: list.map(r => ({ r, good: true })), closest: false };
  const c = regs.filter(r => val(m, r) != null).sort((a, b) => M[m].kind === 'min' ? val(m, b) - val(m, a) : val(m, a) - val(m, b)).slice(0, 3);
  return { list: c.map(r => ({ r, good: false })), closest: true };
}
function peersForTarget(t) {
  const regs = D.regions.filter(r => r !== sel);
  let list = regs.filter(r => tStatus(t, r) === 'ok').sort((a, b) => (sel === FI ? byName(a, b) : sizeDiff(a) - sizeDiff(b)) || byName(a, b));
  if (list.length) return { list: list.map(r => ({ r, good: true })), closest: false };
  const bad = r => t.measures.filter(m => mOk(m, r) === false).length;
  const c = M[t.measures[0]].kind === 'min'
    ? regs.filter(r => agg(t, r).v != null).sort((a, b) => agg(t, b).v - agg(t, a).v).slice(0, 3)
    : regs.slice().sort((a, b) => bad(a) - bad(b) || (agg(t, a).v ?? 1e9) - (agg(t, b).v ?? 1e9)).slice(0, 3);
  return { list: c.map(r => ({ r, good: false })), closest: true };
}
function targetValueText(t, r) {
  if (M[t.measures[0]].kind === 'zero') { const k = t.measures.filter(m => mOk(m, r) === false).length; return k ? `${k} of ${t.measures.length} measures over target` : 'All within target'; }
  return agg(t, r).text;
}
const peerLabel = t => M[t.measures[0]].kind === 'zero' ? 'Waiting times' : AVG_LABEL[t.id];

/* ---------- reports ---------- */
function reportSlot(id) { return `<div class="card report" data-report="${esc(id)}"><div class="ai-note"><span class="spinner"></span> Loading report…</div></div>`; }
function loadReports(root) {
  root.querySelectorAll('[data-report]').forEach(box => {
    const id = box.dataset.report, pre = window.__REPORTS__ && window.__REPORTS__[id];
    const p = pre ? Promise.resolve(pre) : AI.offline ? Promise.resolve({ missing: true, reason: 'offline' }) : fetch(`api/report?id=${enc(id)}`).then(r => r.json());
    p.then(rep => box.innerHTML = reportHtml(rep)).catch(() => box.innerHTML = '<div class="note">Could not load the report.</div>');
  });
}
function reportHtml(rep) {
  if (rep.missing) return `<div class="note">${rep.reason === 'no_key' ? 'No report yet. The AI compiles one from the web with Gemini once GEMINI_API_KEY is set in .env.'
    : rep.reason === 'offline' ? 'No report yet. The AI compiles one from the web when the app runs on its server (Kaynnista_vahti.command) with a Gemini key.'
      : 'The report could not be compiled: ' + esc(rep.reason || '')}</div>`;
  return `<div class="ai-note"><span class="badge" style="background:var(--accent-soft);color:var(--accent)">AI-compiled</span>
      <b style="color:var(--ink)">${esc(rep.title || '')}</b> · ${rep.generated === 'live' ? 'compiled from the web' : 'compiled ' + esc(rep.generated)} · verify sources</div>
    ${(rep.sections || []).map(s => `<div class="rsec"><h4><span class="flag">${esc(s.name)}</span></h4>
      ${s.items.map(it => `<div class="ritem"><p>${esc(it.text)}</p>${(it.sources || []).map(x =>
        `<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(TIER[x.tier] || '')}">${x.tier ? `<span class="tier ${x.tier}">${x.tier}</span>` : ''}${esc(x.title)} ↗</a>`).join('')}</div>`).join('')}</div>`).join('')}
    ${(rep.all_sources || []).length ? `<div class="rsec"><h4><span class="flag">All sources</span></h4>${rep.all_sources.map(x => `<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)} ↗</a>`).join('')}</div>` : ''}
    <div class="note">Source levels: <span class="tier A">A</span> ${TIER.A} · <span class="tier B">B</span> ${TIER.B} · <span class="tier C">C</span> ${TIER.C}</div>`;
}

/* ---------- goal page ---------- */
function renderGoal(v, gid) {
  const g = D.goals.find(x => x.id === gid), r = sel, s = gStatus(g, r);
  const bad = g.targets.filter(t => tStatus(t, r) === 'bad');
  const roles = [...new Set((bad.length ? bad.map(t => t.role || g.role) : [g.role]))];
  v.innerHTML = `<div class="page">
    ${crumbs(`${esc(rname(r))} › Goal ${g.id}`)}
    <div class="card hero"><div class="kicker">Goal ${g.id} · ${esc(rname(r))}</div>
      <div class="hero-row"><h1>${esc(g.title)}</h1>${pill(s.c, gLabel(s))}</div></div>
    <h2>Targets</h2>
    ${g.targets.map(t => targetCard(t, r)).join('')}
    <h2>Contact in ${esc(rname(r))}</h2>
    ${roles.map(role => contactCard(r, role)).join('')}
    ${bad.length ? bad.map(t => peersSection(t)).join('') + `
      <h2>AI report: how others have solved it</h2>
      ${bad.filter(t => t.report).map(t => reportSlot(t.report)).join('')}` : ''}
    <h2>Ask about this goal</h2>${chatCard(`goal-${g.id}-${r}`)}
  </div>`;
  bindMore(v, () => renderGoal(v, gid));
  loadReports(v); bindChats(v, { region: rname(r), target: `Goal ${g.id}: ${g.title}` });
}
function targetCard(t, r) {
  const s = tStatus(t, r);
  let body = '';
  if (t.type === 'measures') {
    const a = agg(t, r), n = agg(t, FI);
    body = `<div class="mrows"><a class="mrow" href="#/t/${t.id}?r=${enc(r)}"><span class="dot ${a.ok === false ? 'bad' : a.ok ? 'ok' : 'na'}"></span><span class="lbl">${esc(a.label)}</span>
      <span class="v ${cls(a.ok)}">${a.text}</span><span class="m">target ${num(a.target)}</span>
      <span class="m">${r === FI ? 'period ' + num(per(M[t.measures[0]].period)) : 'whole country ' + num(n.text, n.ok)}</span><span class="go">›</span></a>
      ${M[t.measures[0]].kind === 'zero' ? measureRow('lahete21', r) : ''}</div>`;
  }
  else if (t.type === 'national') {
    const x = mort();
    body = `<div class="mrows"><a class="mrow" href="#/m/mort?r=${enc(r)}"><span class="dot ${s}"></span><span class="lbl">Cancer deaths per year, whole country</span>
      <span class="v ${cls(x.ok)}">${nf(x.v, 0)}</span><span class="m">target ${num('≤ ' + nf(x.mo.target, 0))} by ${x.mo.target_year}</span><span class="m">year ${num(x.last)}</span><span class="go">›</span></a></div>`;
  }
  return `<div class="card tcard"><div class="tcard-head"><div class="tcard-text">${esc(t.text.replace(/\*+$/, ''))}</div>${pill(s, tLabel(s))}</div>${body}</div>`;
}
function measureRow(m, r) {
  const v = val(m, r), o = isOk(m, v);
  return `<a class="mrow" href="#/m/${m}?r=${enc(r)}"><span class="dot ${o === false ? 'bad' : o ? 'ok' : 'na'}"></span><span class="lbl">${esc(M[m].short)}</span>
    <span class="v ${cls(o)}">${fmt(m, v)}</span><span class="m">target ${num(fmtT(m))}</span>
    <span class="m">${r === FI ? 'period ' + num(per(M[m].period)) : 'whole country ' + num(fmt(m, M[m].national), mOk(m, FI))}</span><span class="go">›</span></a>`;
}
function peersSection(t) {
  if (t.type === 'national') return '';
  const p = peersForTarget(t);
  const intro = p.closest ? `<span style="color:var(--red);font-weight:600">No other area meets this target yet.</span> Closest to the target:`
    : `${p.list.length} areas meet this target${sel === FI ? '' : ', closest in size to ' + esc(sel) + ' first'}.`;
  return `<h2>Regions that meet: ${esc(SHORT[t.id])}</h2>${peersBlock('t' + t.id + sel, p.list, r => targetValueText(t, r), t.role || t.goal.role, intro, peerLabel(t))}`;
}

const kpi = (k, n, ok, sub) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="n ${cls(ok)}">${n}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;

/* ---------- target page: summary first, then the breakdown ---------- */
function renderTarget(v, tid) {
  const t = T(tid), r = sel, s = tStatus(t, r), a = agg(t, r), role = t.role || t.goal.role;
  v.innerHTML = `<div class="page">
    ${crumbs(`${esc(rname(r))} › Goal ${t.goal.id} › ${esc(SHORT[t.id])}`)}
    <div class="card hero"><div class="kicker">Goal ${t.goal.id} · ${esc(rname(r))}</div>
      <div class="hero-row"><h1>${esc(SHORT[t.id])}</h1>${pill(s, tLabel(s))}</div>
      <div class="kpis">${M[t.measures[0]].kind === 'zero' ? `
        ${kpi(a.label, a.text, a.ok, `target ${a.target}${r !== FI ? ' · whole country ' + agg(t, FI).text : ''}`)}
        ${kpi(M.lahete21.label, fmt('lahete21', val('lahete21', r)), mOk('lahete21', r), `target ${fmtT('lahete21')}${r !== FI ? ' · whole country ' + fmt('lahete21', M.lahete21.national) : ''}`)}` : `
        <div class="kpi"><div class="k">${esc(a.label)}</div><div class="n ${cls(a.ok)}">${a.text}</div></div>
        <div class="kpi"><div class="k">Target</div><div class="n">${a.target}</div></div>
        ${r !== FI ? `<div class="kpi"><div class="k">Whole country</div><div class="n ${cls(agg(t, FI).ok)}">${agg(t, FI).text}</div></div>` : ''}`}
        <div class="kpi"><div class="k">Period</div><div class="n" style="font-size:14px;font-weight:600">${per(M[t.measures[0]].period)}</div></div>
      </div>
      ${D.hus_area.includes(r) && role === 'care' ? '<div class="note">THL reports Helsinki and the Uusimaa counties as one HUS row.</div>' : ''}
    </div>
    <h2>${{ 'S2.1': 'By group', 'S2.2': 'By cancer type' }[t.id] || 'By specialty'}</h2>
    <div class="card"><div class="mrows">${t.measures.map(m => measureRow(m, r)).join('')}</div></div>
    <h2>Contact in ${esc(rname(r))}</h2>${contactCard(r, role)}
    ${s === 'bad' ? peersSection(t) + `<h2>AI report: how others have solved it</h2>${reportSlot(t.report)}` : ''}
    <h2>Ask about this</h2>${chatCard(`t-${t.id}-${r}`)}
  </div>`;
  bindMore(v, () => renderTarget(v, tid));
  loadReports(v); bindChats(v, { region: rname(r), target: t.text });
}

/* ---------- measure page ---------- */
function renderMeasure(v, m) {
  const r = sel, t = parentOf(m);
  if (m === 'mort') return renderMort(v, t);
  const x = M[m], value = val(m, r), o = isOk(m, value);
  const st = o === false ? 'bad' : o ? 'ok' : 'na';
  const p = peersForMeasure(m);
  v.innerHTML = `<div class="page">
    ${crumbs(`${esc(rname(r))} › Goal ${t.goal.id} › ${t.type === 'measures' ? esc(SHORT[t.id]) + ' › ' : ''}${esc(x.short)}`)}
    <div class="card hero"><div class="kicker">${esc(SHORT[t.id])} · ${esc(rname(r))}</div>
      <div class="hero-row"><h1>${esc(x.label)}</h1>${pill(st, st === 'na' ? 'No data' : tLabel(st))}</div>
      <div class="kpis">
        <div class="kpi"><div class="k">${esc(rname(r))}</div><div class="n ${o === false ? 'bad' : o ? 'ok' : ''}">${fmt(m, value)}</div></div>
        <div class="kpi"><div class="k">Target</div><div class="n">${fmtT(m)}</div></div>
        ${r !== FI ? `<div class="kpi"><div class="k">Whole country</div><div class="n ${cls(isOk(m, x.national))}">${fmt(m, x.national)}</div></div>` : ''}
        <div class="kpi"><div class="k">Period · source</div><div class="n" style="font-size:14px;font-weight:600">${per(x.period)} · ${esc(x.source)}</div></div>
      </div>
      ${D.hus_area.includes(r) && x.role === 'care' ? '<div class="note">THL reports Helsinki and the Uusimaa counties as one HUS row.</div>' : ''}
    </div>
    <h2>All areas</h2><div class="card chartcard">${barChart(m)}</div>
    <h2>Contact in ${esc(rname(r))}</h2>${contactCard(r, x.role)}
    ${o === false ? `<h2>Areas that meet the target</h2>${peersBlock('m' + m + r, p.list, rr => fmt(m, val(m, rr)), x.role,
      p.closest ? `<span style="color:var(--red);font-weight:600">No other area meets the target yet.</span> Closest to the target:` : `${p.list.length} areas meet the target ${fmtT(m)}.`, x.short)}
      ${t.report ? `<h2>AI report: how others have solved it</h2>${reportSlot(t.report)}` : ''}` : ''}
    <h2>Ask about this</h2>${chatCard(`m-${m}-${r}`)}
  </div>`;
  bindMore(v, () => renderMeasure(v, m));
  loadReports(v); bindChats(v, { region: rname(r), target: `${x.label} (${t.text})` });
}
function barChart(m) {
  const x = M[m], rows = [FI, ...D.regions].map(r => ({ r, v: val(m, r) }));
  rows.sort((a, b) => (a.r === FI ? -1 : b.r === FI ? 1 : 0) || ((b.v ?? -1) - (a.v ?? -1)) || byName(a.r, b.r));
  const W = 760, L = 170, Rr = 70, rh = 22, H = rows.length * rh + 30;
  const max = x.unit === '%' ? 100 : Math.max(5, ...rows.map(o => o.v || 0)) * 1.1;
  const X = v => L + (v / max) * (W - L - Rr);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.label)} by area">
    ${x.kind === 'min' ? `<line x1="${X(x.target)}" x2="${X(x.target)}" y1="4" y2="${H - 22}" stroke="#0f172a" stroke-dasharray="4 4"/>
      <text x="${X(x.target)}" y="${H - 6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">target ${fmtT(m)}</text>` : `<text x="${L}" y="${H - 6}" font-size="11.5" font-weight="600" fill="#0f172a">target ${fmtT(m)}</text>`}
    ${rows.map((o, i) => {
      const y = 8 + i * rh, ok = isOk(m, o.v), me = o.r === sel;
      const col = o.r === FI ? '#94a3b8' : ok === false ? '#f87171' : ok ? '#4ade80' : '#e2e8f0';
      return `${me ? `<rect x="0" y="${y - 2}" width="${W}" height="${rh}" rx="6" fill="#eef3ff"/>` : ''}
        <text x="${L - 10}" y="${y + 13}" text-anchor="end" font-size="12" font-weight="${me || o.r === FI ? 700 : 400}" fill="#0f172a">${esc(rname(o.r))}${x.role === 'care' && D.hus_area.includes(o.r) ? ' (HUS)' : ''}</text>
        <rect x="${L}" y="${y + 3}" width="${Math.max(1.5, o.v == null ? 0 : X(o.v) - L)}" height="${rh - 8}" rx="4" fill="${col}"/>
        <text x="${(o.v == null ? L : X(o.v)) + 6}" y="${y + 13}" font-size="11.5" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke" fill="${ok === false ? '#dc2626' : ok ? '#16a34a' : '#0f172a'}">${fmt(m, o.v)}</text>`;
    }).join('')}
  </svg>`;
}
function renderMort(v, t) {
  const r = sel, x = mort(), st = x.ok ? 'ok' : 'bad';
  v.innerHTML = `<div class="page">
    ${crumbs(`${esc(rname(r))} › Goal 3 › Cancer mortality`)}
    <div class="card hero"><div class="kicker">${esc(SHORT[t.id])} · ${esc(rname(r))}</div>
      <div class="hero-row"><h1>Cancer deaths per year, whole country</h1>${pill(st, tLabel(st))}</div>
      <div class="kpis">${kpi(`Cancer deaths ${x.last}`, nf(x.v, 0), x.ok)}${kpi(`Target by ${x.mo.target_year}`, '≤ ' + nf(x.mo.target, 0))}</div></div>
    <h2>Trend and target</h2><div class="card chartcard">${mortChart()}</div>
    <h2>Contact in ${esc(rname(r))}</h2>${contactCard(r, 'care')}
    ${st === 'bad' ? `<h2>AI report: how others have solved it</h2>${reportSlot('S3.2')}` : ''}
    <h2>Ask about this</h2>${chatCard(`m-mort-${r}`)}
  </div>`;
  loadReports(v); bindChats(v, { region: rname(r), target: t.text });
}
function mortChart() {
  const mo = D.mort, ys = Object.keys(mo.counts).map(Number).sort((a, b) => a - b);
  const W = 760, H = 240, L = 60, R = 24, Tp = 16, B = 30, x0 = ys[0], x1 = mo.target_year, y0 = 11000, y1 = 14000;
  const X = y => L + (y - x0) / (x1 - x0) * (W - L - R), Y = v => Tp + (y1 - v) / (y1 - y0) * (H - Tp - B);
  const line = ys.map((y, i) => `${i ? 'L' : 'M'}${X(y).toFixed(1)} ${Y(mo.counts[y]).toFixed(1)}`).join('');
  const last = ys[ys.length - 1], vc = mort().ok ? '#16a34a' : '#dc2626';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cancer deaths and target">
    ${[11000, 12000, 13000, 14000].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef0f3"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#0f172a">${nf(v, 0)}</text>`).join('')}
    ${[2010, 2015, 2020, 2025, 2030, 2035].map(y => `<text x="${X(y)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#0f172a">${y}</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${Y(mo.target)}" y2="${Y(mo.target)}" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="${line}" stroke="#0f172a" stroke-width="2.2" fill="none"/>
    <circle cx="${X(last)}" cy="${Y(mo.counts[last])}" r="4" fill="${vc}"/>
    <text x="${X(last) + 8}" y="${Y(mo.counts[last]) - 8}" font-size="12" font-weight="600" fill="${vc}">${nf(mo.counts[last], 0)} (${last})</text>
    <text x="${W - R}" y="${Y(mo.target) + 18}" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">target ≤ ${nf(mo.target, 0)} by ${mo.target_year}</text>
  </svg><div class="note">Line = cancer deaths per year · dashed = target</div>`;
}

/* ---------- chat ---------- */
function md(s) {
  let html = '', list = false;
  for (let l of esc(s).split('\n')) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    if (/^\s*#{1,6}\s/.test(l)) { if (list) { html += '</ul>'; list = false; } html += `<h5>${l.replace(/^\s*#+\s*/, '')}</h5>`; }
    else if (/^\s*[-*]\s+/.test(l)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${l.replace(/^\s*[-*]\s+/, '')}</li>`; }
    else if (!l.trim()) { if (list) { html += '</ul>'; list = false; } }
    else { if (list) { html += '</ul>'; list = false; } html += `<p>${l}</p>`; }
  }
  return html + (list ? '</ul>' : '');
}
const emptyText = () => AI.offline ? 'The chat needs the server: start Kaynnista_vahti.command and open http://localhost:8765.'
  : !AI.ai ? 'The chat is not enabled yet: add GEMINI_API_KEY to the .env file and restart the server.'
    : 'Ask anything about the targets, the areas or the data. I will also search the web when needed.';
function chatCard(key) { return `<div class="card chat-card"><div class="chat-box" data-chat="${esc(key)}"></div></div>`; }
function chatInner(key) {
  const arr = chats[key] || [];
  return `<div class="msgs">${arr.length ? arr.map(m => m.role === 'user' ? `<div class="msg user">${esc(m.text)}</div>`
    : `<div class="msg ai">${m.pending ? '<span class="spinner"></span>' : md(m.text)}${(m.sources || []).length
      ? `<div class="srcs"><b>Sources</b>${m.sources.map((s, i) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${i + 1}. ${esc(s.title)} ↗</a>`).join('')}</div>` : ''}</div>`).join('')
    : `<div class="empty">${emptyText()}</div>`}</div>
    <form class="chat-in"><textarea rows="2" placeholder="Ask a question…"></textarea><button type="submit" aria-label="Send">➤</button></form>`;
}
function mountChat(box, ctx) {
  const key = box.dataset.chat;
  const draw = () => {
    box.innerHTML = chatInner(key);
    const ms = box.querySelector('.msgs'); ms.scrollTop = ms.scrollHeight;
    const ta = box.querySelector('textarea'), form = box.querySelector('form');
    form.onsubmit = e => { e.preventDefault(); send(key, ta.value, ctx, draw); };
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(key, ta.value, ctx, draw); } };
  };
  draw();
}
function bindChats(root, ctx) { root.querySelectorAll('[data-chat]').forEach(b => mountChat(b, ctx)); }
function send(key, text, ctx, draw) {
  text = (text || '').trim(); if (!text) return;
  const arr = chats[key] = chats[key] || [];
  arr.push({ role: 'user', text });
  const pending = { role: 'assistant', pending: true, text: '' };
  arr.push(pending); draw();
  const redraw = () => { const b = document.querySelector(`[data-chat="${CSS.escape(key)}"]`); if (b) { mountChat(b, ctx); } };
  fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: arr.filter(m => !m.pending).map(m => ({ role: m.role, text: m.text })), context: ctx }) })
    .then(r => r.json()).then(res => { pending.pending = false; pending.text = res.text || ''; pending.sources = res.sources || []; redraw(); })
    .catch(() => { pending.pending = false; pending.text = emptyText(); redraw(); });
}
function toggleDrawer(open) {
  const d = $('#drawer'); d.classList.toggle('open', open); d.setAttribute('aria-hidden', String(!open));
  if (open) { const b = $('#generalChat'); b.dataset.chat = 'general'; mountChat(b, { region: rname(sel) }); }
}

</script>
